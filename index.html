<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" id="meta-author" content="">
<meta name="description" id="meta-desc" content="">
<meta name="keywords" id="meta-keys" content="">
<title>Homepage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Noto+Sans+KR:300,400,500,700&display=swap" rel="stylesheet">
<style>
:root{
  --global-bg-color:#fff;
  --global-code-bg-color:rgba(11,92,142,.05);
  --global-text-color:#000;
  --global-text-color-light:#828282;
  --global-theme-color:var(--site-theme,#0B5C8E);
  --global-hover-color:var(--site-theme,#0B5C8E);
  --global-hover-text-color:#fff;
  --global-footer-bg-color:#e8e8e8;
  --global-footer-text-color:#1c1c1d;
  --global-footer-link-color:#000;
  --global-divider-color:rgba(0,0,0,.1);
  --global-card-bg-color:#fff;
  --global-highlight-color:#b71c1c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --global-bg-color:#1c1c1d;
    --global-code-bg-color:#2c3237;
    --global-text-color:#e8e8e8;
    --global-text-color-light:#e8e8e8;
    --global-theme-color:var(--site-theme-dark,#3FA0D8);
    --global-hover-color:var(--site-theme-dark,#3FA0D8);
    --global-hover-text-color:#fff;
    --global-footer-bg-color:#1c1c1d;
    --global-footer-text-color:#e8e8e8;
    --global-footer-link-color:#fff;
    --global-divider-color:#424246;
    --global-card-bg-color:#212529;
  }
}
:root[data-theme="dark"]{
  --global-bg-color:#1c1c1d;
  --global-code-bg-color:#2c3237;
  --global-text-color:#e8e8e8;
  --global-text-color-light:#e8e8e8;
  --global-theme-color:var(--site-theme-dark,#3FA0D8);
  --global-hover-color:var(--site-theme-dark,#3FA0D8);
  --global-hover-text-color:#fff;
  --global-footer-bg-color:#1c1c1d;
  --global-footer-text-color:#e8e8e8;
  --global-footer-link-color:#fff;
  --global-divider-color:#424246;
  --global-card-bg-color:#212529;
}
html{scroll-padding-top:calc(66px + env(safe-area-inset-top,0px));}
*,*::before,*::after{box-sizing:inherit;}
html,body{margin:0;}
body{
  font-family:"Roboto","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  font-size:1rem;font-weight:300;line-height:1.5;
  color:var(--global-text-color);background-color:var(--global-bg-color);
  padding-top:57px;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--global-theme-color);text-decoration:none;}
a:hover{color:var(--global-hover-color);text-decoration:underline;}
.container{width:100%;max-width:1140px;margin:0 auto;padding:0 15px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ---------- Navbar (al-folio) ---------- */
#navbar{
  position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:1030;
  background-color:var(--global-bg-color);opacity:.95;
  border-bottom:1px solid var(--global-divider-color);
  padding:.5rem 1rem;
}
#navbar .container{display:flex;align-items:center;justify-content:space-between;}
.navbar-brand{font-size:1.25rem;font-weight:400;color:var(--global-text-color);padding:.3125rem 0;}
.navbar-brand:hover{color:var(--global-text-color);text-decoration:none;}
.navbar-toggler{display:none;background:none;border:1px solid transparent;padding:.25rem .5rem;cursor:pointer;margin-left:auto;}
.navbar-toggler .icon-bar{display:block;width:22px;height:2px;background-color:var(--global-text-color);border-radius:1px;margin-bottom:4px;transition:all .2s;}
.navbar-toggler:not(.collapsed) .top-bar{transform:rotate(45deg);transform-origin:10% 10%;}
.navbar-toggler:not(.collapsed) .middle-bar{opacity:0;}
.navbar-toggler:not(.collapsed) .bottom-bar{transform:rotate(-45deg);transform-origin:10% 90%;}
.navbar-nav{display:flex;list-style:none;margin:0;padding:0;align-items:center;}
.nav-link{display:block;padding:.5rem;color:var(--global-text-color);font-size:1rem;}
.nav-link:hover{color:var(--global-hover-color);text-decoration:none;}
.nav-item.active>.nav-link{font-weight:bolder;color:var(--global-theme-color);}
#light-toggle{background:none;border:0;cursor:pointer;color:var(--global-text-color);padding:.5rem;display:inline-flex;align-items:center;font-size:1.1rem;}
#light-toggle:hover{color:var(--global-hover-color);}
#light-toggle svg{width:1.05em;height:1.05em;fill:currentColor;}
.toggle-container{margin-left:.25rem;}
@media (max-width:575.98px){
  #navbar .container{flex-wrap:wrap;}
  .navbar-toggler{display:block;}
  .navbar-collapse{display:none;width:100%;text-align:right;}
  .navbar-collapse.show{display:block;}
  .navbar-nav{flex-direction:column;align-items:flex-end;}
  .nav-link{padding:.5rem 0;}
}

/* ---------- Content ---------- */
main.container{margin-top:3rem;}
.post{padding-bottom:2rem;}
.post-title,h1{color:var(--global-theme-color);font-size:2rem;font-weight:400;text-align:center;margin:1em 0;}
h3{font-size:1.5rem;font-weight:500;margin:1rem 0 1rem;}
h2{font-size:1.75rem;font-weight:300;margin:0 0 1rem;}
h2.pub-section{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.25rem 1rem;font-size:1.4rem;font-weight:600;color:var(--global-theme-color);border-bottom:2px solid var(--global-divider-color);padding-bottom:.3rem;margin-top:2.5rem;margin-bottom:1.2rem;}
.mt-4{margin-top:1.5rem;}
.page{display:none;}
.page.active{display:block;}

table{border-collapse:collapse;width:100%;color:var(--global-text-color);}
table.table-cv td{padding:.25rem .5rem .25rem 0;vertical-align:top;}
table.table-cv td.key{font-weight:700;white-space:nowrap;padding-right:1rem;}
table.table-cv td.val{font-weight:300;}
strong,b{font-weight:700;}
table.news th{width:18%;vertical-align:top;font-weight:600;text-align:left;padding:.3rem .3rem .3rem 0;white-space:nowrap;}
table.news td{vertical-align:top;padding:.3rem .3rem .3rem .3rem;}
table.news .sub{opacity:.85;}
table.cv-table th,table.cv-table td{padding:.35rem 1rem .35rem 0;vertical-align:top;text-align:left;border-bottom:1px solid var(--global-divider-color);}
table.cv-table thead th{border-bottom:1px solid var(--global-divider-color);white-space:nowrap;font-weight:600;}
table.cv-table .cv-table-date,table.cv-table .cv-table-number{white-space:nowrap;}
.sub-small{font-size:.8em;color:var(--global-text-color-light);}
.table-wrap{overflow-x:auto;max-width:100%;}
@media (max-width:575.98px){
  table.news th{width:auto;white-space:normal;}
}

/* ---------- Research ---------- */
.research h2{font-size:1.5rem;margin-top:2rem;}
.research h2 a{color:var(--global-text-color);}
.research ul{margin:0 0 1rem;padding-left:1.25rem;}
.research li{margin-bottom:.3rem;}

.rf-back{display:inline-block;margin-bottom:1rem;font-size:.95rem;}
.rf-lead{font-size:1.05rem;margin:0 0 1.8rem;}
.rf-sub{margin:1.6rem 0 2.4rem;}
.rf-sub h2{font-size:1.25rem;font-weight:500;margin:0 0 .5rem;}
.rf-sub ul{margin:0 0 .9rem;padding-left:1.15rem;}
.rf-sub li{margin:.18rem 0;line-height:1.5;}
.rf-fig{text-align:center;margin:1rem 0 .4rem;}
.rf-fig img{max-width:100%;width:820px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.12);background:#fff;padding:6px;}
.rf-caption{font-size:.85rem;color:var(--global-text-color-light);margin-top:.4rem;}
.rf-fig-placeholder{max-width:820px;margin:0 auto;aspect-ratio:16/7;display:flex;align-items:center;justify-content:center;border:2px dashed var(--global-divider-color);border-radius:8px;color:var(--global-text-color-light);font-size:.95rem;}
.research h2 a:hover{color:var(--global-hover-color);text-decoration:none;}

/* ---------- Publications (al-folio) ---------- */
.publications{margin-top:2rem;}
.pub-stats{display:flex;flex-wrap:wrap;gap:.75rem;margin:0 0 1.25rem;}
.pub-stat{flex:1 1 140px;border:1px solid var(--global-divider-color);border-radius:4px;padding:.7rem .9rem;text-align:center;}
.pub-stat .num{display:block;font-size:1.6rem;font-weight:500;color:var(--global-theme-color);line-height:1.2;}
.pub-stat .lbl{display:block;font-size:.85rem;color:var(--global-text-color-light);}
.publications .legend{color:var(--global-text-color-light);font-size:.85rem;font-weight:400;margin:0;}
.publications ol.bibliography{list-style:none;padding:0;margin-top:0;counter-reset:bibcounter;}
.publications ol.bibliography li{margin-bottom:1.4rem;counter-increment:bibcounter;position:relative;padding-left:2.6rem;}
.publications ol.bibliography.reversed li::before{content:attr(data-n) ".";}
.publications ol.bibliography li::before{content:counter(bibcounter) ".";position:absolute;left:0;top:0;min-width:2rem;text-align:right;font-weight:600;color:var(--global-theme-color);}
.publications .title{font-weight:bolder;}
.publications .author{margin-top:.1rem;}
.publications .author em{font-style:normal;font-weight:700;color:var(--global-text-color);}
.publications .author sup{font-size:.7em;color:var(--global-theme-color);font-weight:700;}
.publications .periodical{font-size:1rem;}
.publications .periodical em{font-style:italic;}
.publications .note{font-size:.9rem;opacity:.85;}
.publications .links{margin-top:.4rem;}
.publications .links a.btn{display:inline-block;color:var(--global-text-color);border:1px solid var(--global-text-color);border-radius:2px;padding:.25rem 1rem;font-size:.8rem;font-weight:400;text-transform:uppercase;letter-spacing:.02em;margin:0 .4rem .3rem 0;line-height:1.5;}
.publications .links a.btn:hover{color:var(--global-theme-color);border-color:var(--global-theme-color);text-decoration:none;}

/* ---------- Footer ---------- */
footer.sticky-bottom{border-top:1px solid var(--global-divider-color);padding:40px 0;font-size:.9rem;margin-top:2rem;}
footer.sticky-bottom .container{text-align:center;color:var(--global-text-color);}
footer a{color:var(--global-text-color);text-decoration:underline;}
footer a:hover{color:var(--global-theme-color);}

/* ---------- CV download button ---------- */
.cv-download{text-align:center;margin:-.5rem 0 1rem;}
.btn-outline{background:none;cursor:pointer;font:inherit;font-size:.85rem;color:var(--global-text-color);border:1px solid var(--global-text-color);border-radius:2px;padding:.3rem 1rem;text-transform:uppercase;letter-spacing:.02em;}
.btn-outline:hover{color:var(--global-theme-color);border-color:var(--global-theme-color);}
.print-header{display:none;}

/* ---------- Print layout (CV PDF generated from the site data) ---------- */
@media print{
  @page{size:A4;margin:15mm 16mm 17mm;}
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --global-bg-color:#fff;--global-text-color:#1a1a1a;--global-text-color-light:#666;
    --global-theme-color:var(--site-theme,#0B5C8E);--global-divider-color:#d6d6d6;
  }
  html,body{padding:0;margin:0;background:#fff;}
  body{font-size:9.6pt;font-weight:400;line-height:1.4;color:var(--global-text-color);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  header>nav,footer,.cv-download,.rf-back,.rf-fig,.rf-lead,.pub-stats,.legend-note,.navbar-toggler,
  #page-projects>article>p,#page-cv .post-header,#page-cv .contact-block,
  #page-research-multiscale,#page-research-polymers,#page-research-interfaces{display:none!important;}
  main.container{max-width:none;margin:0;padding:0;display:flex;flex-direction:column;}
  .page{display:block!important;padding:0;}
  #page-cv{order:1;}#page-research{order:2;}#page-projects{order:3;}#page-publications{order:4;}#page-conferences{order:5;}

  /* header */
  .print-header{display:grid;grid-template-columns:minmax(0,1fr) max-content;column-gap:20pt;align-items:end;
    border-bottom:2.2pt solid var(--global-theme-color);padding-bottom:7pt;margin-bottom:12pt;}
  .ph-name{grid-column:1;font-size:24pt;font-weight:700;letter-spacing:-.01em;color:var(--global-theme-color);line-height:1.1;}
  .ph-title{grid-column:1;font-size:10.5pt;font-weight:500;margin-top:5pt;}
  .ph-email{grid-column:1;font-size:9.5pt;color:var(--global-text-color-light);margin-top:1pt;}
  .ph-meta{grid-column:2;grid-row:1 / span 3;text-align:right;font-size:8.6pt;color:var(--global-text-color-light);line-height:1.45;align-self:end;}

  /* section titles */
  .post-title,h1{font-size:12.5pt;font-weight:700;color:var(--global-theme-color);text-align:left;
    margin:16pt 0 7pt;padding-bottom:3pt;border-bottom:1.2pt solid var(--global-theme-color);break-after:avoid;}
  h3{font-size:11pt;font-weight:700;color:var(--global-text-color);margin:12pt 0 5pt;break-after:avoid;}
  h2.pub-section{display:flex;justify-content:space-between;align-items:baseline;font-size:11pt;font-weight:700;color:var(--global-text-color);margin:12pt 0 6pt;padding:0;border:0;break-after:avoid;}
  .mt-4{margin-top:0;}

  /* timeline tables */
  table.news th{width:19%;padding:2.5pt 8pt 2.5pt 0;font-weight:600;color:var(--global-theme-color);font-size:9.3pt;}
  table.news td{padding:2.5pt 0;}
  table.news .sub{opacity:1;color:var(--global-text-color-light);font-size:9pt;}
  table.news strong{font-weight:700;}
  table.cv-table{font-size:9.2pt;}
  table.cv-table thead th{font-weight:700;color:var(--global-text-color);border-bottom:1pt solid var(--global-text-color);padding:2pt 8pt 3pt 0;}
  table.cv-table td{padding:3pt 8pt 3pt 0;border-bottom:.5pt solid var(--global-divider-color);}
  #page-projects article{break-inside:avoid;}

  /* research field */
  .research h2{font-size:10.3pt;font-weight:700;margin:7pt 0 2pt;color:var(--global-text-color);}
  .research h2 a{color:inherit;}
  .research ul{margin:0 0 5pt;padding-left:12pt;}
  .research li{margin:0;}

  /* publications & conferences */
  .publications{margin-top:0;}
  .publications .legend{margin:0;font-size:8.3pt;font-weight:400;color:var(--global-text-color-light);}
  .publications .legend a{color:inherit;}
  .publications ol.bibliography li{margin-bottom:6.5pt;padding-left:24pt;break-inside:avoid;}
  .publications ol.bibliography li::before{min-width:19pt;font-size:9.3pt;font-weight:700;color:var(--global-theme-color);top:1pt;}
  .publications .title{font-weight:700;color:var(--global-text-color);line-height:1.3;text-wrap:pretty;}
  table.news td,table.cv-table td{text-wrap:pretty;}
  .publications .author{font-size:9.2pt;margin-top:1pt;}
  .publications .author em{font-weight:700;}
  .publications .author sup{color:var(--global-theme-color);}
  .publications .periodical{font-size:9.2pt;}
  .publications .periodical em{font-style:italic;}
  .publications .note{font-size:8.8pt;color:var(--global-text-color-light);font-style:italic;}
  .publications .links{margin-top:0;font-size:8.3pt;color:var(--global-text-color-light);}
  .publications .links a.btn{border:0;padding:0;margin:0 10pt 0 0;text-transform:none;letter-spacing:0;color:var(--global-text-color-light);font-size:8.3pt;}
  .publications .links a.btn:not([data-doi]){display:none;}
  .publications .links a.btn[data-doi]::after{content:" " attr(data-doi);}
  tr{break-inside:avoid;}
  a{color:inherit;text-decoration:none;}
}

:focus-visible{outline:2px solid var(--global-theme-color);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<header>
  <nav id="navbar" role="navigation">
    <div class="container">
      <a class="navbar-brand" id="brand" href="#cv" style="display:none"></a>
      <button class="navbar-toggler collapsed" type="button" id="navToggle" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar top-bar"></span>
        <span class="icon-bar middle-bar"></span>
        <span class="icon-bar bottom-bar"></span>
      </button>
      <div class="navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="nav-list">
          <li class="toggle-container">
            <button id="light-toggle" title="Change theme" aria-label="Change theme">
              <svg id="icon-system" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 0a256 256 0 1 0 0 512 256 256 0 0 0 0-512zm0 464V48a208 208 0 0 1 0 416z"/></svg>
              <svg id="icon-dark" viewBox="0 0 384 512" aria-hidden="true" style="display:none"><path d="M223.5 32C100 32 0 132.3 0 256s100 224 223.5 224c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"/></svg>
              <svg id="icon-light" viewBox="0 0 512 512" aria-hidden="true" style="display:none"><path d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1-192 0zm224 0a128 128 0 1 0-256 0 128 128 0 1 0 256 0z"/></svg>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
<main class="container" role="main">

<!-- ================= CV ================= -->
<section class="page post" id="page-cv">
  <header class="post-header"><h1 class="post-title">CV</h1>
    <p class="cv-download"><button id="cv-pdf" class="btn-outline" type="button">Download CV (PDF)</button></p>
  </header>
  <div class="print-header" id="print-header"></div>
  <article class="cv">
    <div class="mt-4 contact-block"><h3>Contact Information</h3><table class="table-cv" id="contact"></table></div>
    <div class="mt-4"><h3>Experience</h3><table class="news" id="experience"></table></div>
    <div class="mt-4"><h3>Education</h3><table class="news" id="education"></table></div>
    <div class="mt-4" id="awards-block"><h3>Honors and Awards</h3><table class="news" id="awards"></table></div>
    <div id="cv-extra"></div>
  </article>
</section>

<!-- ================= Research ================= -->
<section class="page post" id="page-research">
  <header class="post-header"><h1 class="post-title">Research Field</h1></header>
  <article class="research" id="research-list"></article>
</section>
<div id="research-subpages"></div>

<!-- ================= Publications ================= -->
<section class="page post" id="page-publications">
  <header class="post-header"><h1 class="post-title">Publications</h1></header>
  <article class="publications">
    <div id="pub-sections"></div>
    <div id="patents-block">
    <h2 class="pub-section">Patents</h2>
    <div class="table-wrap">
      <table class="cv-table">
        <thead><tr><th scope="col" class="cv-table-date">Date</th><th scope="col">Title</th><th scope="col">Inventors</th><th scope="col" class="cv-table-number">Patent No.</th></tr></thead>
        <tbody id="patents"></tbody>
      </table>
    </div>
    </div>
  </article>
</section>

<!-- ================= Conferences ================= -->
<section class="page post" id="page-conferences">
  <header class="post-header"><h1 class="post-title">Conferences</h1></header>
  <article class="publications">
    <div id="conf-sections"></div>
  </article>
</section>

<!-- ================= Projects ================= -->
<section class="page post" id="page-projects">
  <header class="post-header"><h1 class="post-title">Projects</h1></header>
  <article class="cv">
    <p>Funded research projects.</p>
    <div class="table-wrap">
    <table class="cv-table">
      <thead><tr><th scope="col" class="cv-table-date">Period</th><th scope="col">Project</th><th scope="col">Funding</th><th scope="col" class="cv-table-number">Role</th></tr></thead>
      <tbody id="projects"></tbody>
    </table>
    </div>
  </article>
</section>

</main>

<footer class="sticky-bottom">
  <div class="container" id="footer-text"></div>
</footer>

<script src="data.js"></script>
<script>
/* ======================= Rendering (no need to edit) ======================= */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtAuthor(name){
  const m = name.match(/^(.*?)([†*]*)$/);
  const base = m[1].trim(), mark = m[2];
  const html = (base === ME || base === ME_KO) ? "<em>"+esc(base)+"</em>" : esc(base);
  return html + (mark ? "<sup>"+mark+"</sup>" : "");
}
function fmtAuthors(list, korean){
  const f = list.map(fmtAuthor);
  if (korean) return f.join(", ");
  if (f.length === 1) return f[0];
  if (f.length === 2) return f[0]+" and "+f[1];
  return f.slice(0,-1).join(", ")+", and "+f[f.length-1];
}
function numberReversed(ol){
  const items = ol.querySelectorAll(":scope > li");
  items.forEach((li, i) => li.setAttribute("data-n", items.length - i));
}

/* --- Site-level settings --- */
function applySite(){
  document.documentElement.style.setProperty("--site-theme", SITE.themeColor);
  document.documentElement.style.setProperty("--site-theme-dark", SITE.themeColorDark || SITE.themeColor);
  document.getElementById("meta-desc").content = SITE.description || "";
  document.getElementById("meta-keys").content = SITE.keywords || "";
  document.getElementById("meta-author").content = PROFILE.name;
  const counts = {projects: PROJECTS.length, conferences: CONF_SECTIONS.reduce((n,s)=>n+s.items.length,0),
                  publications: PUB_SECTIONS.reduce((n,s)=>n+s.items.length,0)+PATENTS.length, research: RESEARCH.length, cv: 1};
  document.getElementById("nav-list").insertAdjacentHTML("afterbegin", SITE.nav.filter(n => counts[n.id] !== 0).map(n =>
    '<li class="nav-item" data-page="'+esc(n.id)+'"><a class="nav-link" href="#'+esc(n.id)+'">'+esc(n.label)+'</a></li>').join(""));
}

/* --- CV page --- */
function renderCV(){
  const links = (PROFILE.links||[]).map(l => '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>').join(" · ");
  document.getElementById("contact").innerHTML =
    '<tr><td class="key">Name</td><td class="val">'+esc(PROFILE.name)+(PROFILE.nameKo ? ' ('+esc(PROFILE.nameKo)+')' : '')+'</td></tr>'+
    '<tr><td class="key">Professional Title</td><td class="val">'+esc(PROFILE.title)+(PROFILE.tagline ? ' · '+esc(PROFILE.tagline) : '')+'</td></tr>'+
    '<tr><td class="key">Email</td><td class="val"><a href="mailto:'+esc(PROFILE.email)+'">'+esc(PROFILE.email)+'</a></td></tr>'+
    (PROFILE.phone ? '<tr><td class="key">Phone</td><td class="val">'+esc(PROFILE.phone)+'</td></tr>' : '')+
    '<tr><td class="key">Location</td><td class="val">'+esc(PROFILE.location)+'</td></tr>'+
    (links ? '<tr><td class="key">Profiles</td><td class="val">'+links+'</td></tr>' : '');
  document.getElementById("cv-extra").innerHTML = (typeof CV_EXTRA==="undefined" ? [] : CV_EXTRA).filter(s => s.rows && s.rows.length).map(s =>
    '<div class="mt-4"><h3>'+esc(s.title)+'</h3><table class="news">'+s.rows.map(r => '<tr><th scope="row">'+esc(r.d)+'</th><td>'+esc(r.t)+'</td></tr>').join("")+'</table></div>').join("");
  document.getElementById("awards-block").style.display = AWARDS.length ? "" : "none";
  const row = e => '<tr><th scope="row">'+esc(e.period)+'</th><td><strong>'+esc(e.title)+'</strong>, '+esc(e.org)+
    (e.sub ? '<br><span class="sub">'+esc(e.sub)+(e.thesis ? '<br>Thesis: <em>'+esc(e.thesis)+'</em>' : '')+'</span>' : '')+'</td></tr>';
  document.getElementById("experience").innerHTML = EXPERIENCE.map(row).join("");
  document.getElementById("education").innerHTML = EDUCATION.map(row).join("");
  document.getElementById("awards").innerHTML = AWARDS.map(a => '<tr><th scope="row">'+esc(a.d)+'</th><td>'+esc(a.t)+'</td></tr>').join("");
  document.getElementById("print-header").innerHTML =
    '<div class="ph-name">'+esc(PROFILE.name)+'</div>'+
    '<div class="ph-title">'+esc(PROFILE.title)+'<br>'+esc(PROFILE.affiliation)+'</div>'+
    '<div class="ph-email">'+esc(PROFILE.email)+'</div>'+
    '<div class="ph-meta">Curriculum Vitae<br>Last updated <span id="print-date"></span></div>';
  document.getElementById("footer-text").textContent = "© Copyright "+new Date().getFullYear()+" "+PROFILE.name+".";
  document.getElementById("brand").textContent = PROFILE.name;
}

/* --- Research --- */
function figs(t){
  // t.fig: "" | "path" | ["path1","path2"] ; t.caption: 선택
  const list = Array.isArray(t.fig) ? t.fig : (t.fig ? [t.fig] : []);
  if (!list.length) return '<div class="rf-fig"><div class="rf-fig-placeholder">Figure</div></div>';
  return list.map((src, i) => '<div class="rf-fig"><img src="'+esc(src)+'" alt="'+esc(t.h)+'">'+
    (t.caption && i===list.length-1 ? '<div class="rf-caption">'+esc(t.caption)+'</div>' : '')+'</div>').join("");
}
function renderResearch(){
  document.getElementById("research-list").innerHTML = RESEARCH.map(r =>
    '<h2><a href="#research/'+esc(r.id)+'">'+esc(r.title)+'</a></h2><ul>'+r.bullets.map(b=>'<li>'+esc(b)+'</li>').join("")+'</ul>').join("");
  document.getElementById("research-subpages").innerHTML = RESEARCH.map(r =>
    '<section class="page post" id="page-research-'+esc(r.id)+'">'+
    '<header class="post-header"><h1 class="post-title">'+esc(r.title)+'</h1></header>'+
    '<article class="rf"><p><a class="rf-back" href="#research">← Research Field</a></p>'+
    '<p class="rf-lead">'+esc(r.lead)+'</p>'+
    r.topics.map(t => '<div class="rf-sub"><h2>'+esc(t.h)+'</h2><ul>'+t.items.map(i=>'<li>'+esc(i)+'</li>').join("")+'</ul>'+
      figs(t)+'</div>').join("")+
    '</article></section>').join("");
}

/* --- Publications --- */
function pubItem(p, korean){
    const vol = p.v ? ", "+esc(p.v) : "";
    const note = p.n ? '<div class="note">'+esc(p.n)+'</div>' : "";
    let links = p.doi ? '<a class="btn" href="https://doi.org/'+esc(p.doi)+'" data-doi="'+esc(p.doi)+'" target="_blank" rel="external nofollow noopener">DOI</a>' : "";
    if (p.cover) links += '<a class="btn" href="'+esc(p.cover)+'" target="_blank" rel="external nofollow noopener">Cover</a>';
    return '<li><div class="title">'+esc(p.t)+'</div><div class="author">'+fmtAuthors(p.a)+'</div>'+
      '<div class="periodical"><em>'+esc(p.j)+'</em>'+vol+', '+esc(p.y)+'</div>'+note+
      (links ? '<div class="links">'+links+'</div>' : '')+'</li>';
}
function renderSections(containerId, sections, itemFn){
  const box = document.getElementById(containerId);
  box.innerHTML = sections.filter(s => s.items && s.items.length).map((s, i) =>
    '<h2 class="pub-section">'+esc(s.title)+(s.legend ? '<span class="legend">'+s.legend+'</span>' : '')+'</h2>'+
    (s.stats ? '<div class="pub-stats" id="pub-stats"></div>' : '')+
    '<ol class="bibliography reversed" data-sec="'+i+'">'+s.items.map(p => itemFn(p, s.korean)).join("")+'</ol>').join("");
  box.querySelectorAll("ol.bibliography").forEach(numberReversed);
}
function renderPubs(){
  renderSections("pub-sections", PUB_SECTIONS, pubItem);
  const stat = PUB_SECTIONS.find(s => s.stats);
  const box = document.getElementById("pub-stats");
  if (stat && box){
    const marks = p => (p.a.find(a => a.startsWith(ME) || a.startsWith(ME_KO)) || "").replace(/^[^†*]*/, "");
    const first = stat.items.filter(p => marks(p).includes("†")).length;
    const corr  = stat.items.filter(p => marks(p).includes("*")).length;
    box.innerHTML = [[stat.items.length,"SCIE articles"],[first,"First-author"],[corr,"Corresponding-author"],[IN_SUBMISSION_COUNT,"In submission"]]
      .map(s => '<div class="pub-stat"><span class="num">'+s[0]+'</span><span class="lbl">'+s[1]+'</span></div>').join("");
  }
  document.getElementById("patents-block").style.display = PATENTS.length ? "" : "none";
  document.getElementById("patents").innerHTML = PATENTS.map(p =>
    '<tr><td class="cv-table-date">'+esc(p.d||"")+(p.status ? '<br><span class="sub-small">'+esc(p.status)+'</span>' : '')+'</td><td>'+esc(p.t)+'</td><td>'+esc(p.inventors)+'</td><td class="cv-table-number">'+esc(p.no)+'</td></tr>').join("");
}

/* --- Conferences & Projects --- */
function confItem(c, korean){
  return '<li><div class="title">'+esc(c.t)+'</div><div class="author">'+fmtAuthors(c.a, korean)+'</div>'+
    '<div class="periodical">'+esc(c.c)+(c.loc ? ', '+esc(c.loc) : '')+', '+esc(c.d)+'</div></li>';
}
function renderConf(){ renderSections("conf-sections", CONF_SECTIONS, confItem); }
function renderProjects(){
  document.getElementById("projects").innerHTML = PROJECTS.map(p =>
    '<tr><td class="cv-table-date">'+esc(p.period)+'</td><td>'+esc(p.title)+'</td><td>'+p.fund+'</td><td class="cv-table-number">'+esc(p.role)+'</td></tr>').join("");
}

/* ---------------- Routing ---------------- */
function allPages(){ return Array.from(document.querySelectorAll("section.page")).map(s => s.id.replace("page-","")); }
function route(){
  const pages = allPages();
  let h = (location.hash || "#cv").replace("#","").replace("/","-");
  if (!pages.includes(h)) h = "cv";
  pages.forEach(p => document.getElementById("page-"+p).classList.toggle("active", p===h));
  const navKey = h.startsWith("research") ? "research" : h;
  document.querySelectorAll(".nav-item[data-page]").forEach(li => li.classList.toggle("active", li.dataset.page===navKey));
  document.getElementById("brand").style.display = (h==="cv") ? "none" : "inline-block";
  const sec = document.getElementById("page-"+h);
  const t = sec.querySelector(".post-title").textContent.trim();
  document.title = (h==="cv") ? PROFILE.name : t+" | "+PROFILE.name;
  document.getElementById("navbarNav").classList.remove("show");
  document.getElementById("navToggle").classList.add("collapsed");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* ---------------- Theme toggle (system → dark → light) ---------------- */
const root = document.documentElement;
function applyTheme(setting){
  if (setting === "dark" || setting === "light") root.setAttribute("data-theme", setting);
  else root.removeAttribute("data-theme");
  document.getElementById("icon-system").style.display = (setting==="system") ? "" : "none";
  document.getElementById("icon-dark").style.display   = (setting==="dark")   ? "" : "none";
  document.getElementById("icon-light").style.display  = (setting==="light")  ? "" : "none";
}
function getSetting(){ try{ return localStorage.getItem("theme") || "system"; }catch(e){ return "system"; } }
function setSetting(s){ try{ localStorage.setItem("theme", s); }catch(e){} applyTheme(s); }
document.getElementById("light-toggle").addEventListener("click", () => {
  const cur = getSetting();
  setSetting(cur==="system" ? "dark" : cur==="dark" ? "light" : "system");
});
document.getElementById("navToggle").addEventListener("click", function(){
  const nav = document.getElementById("navbarNav");
  const open = nav.classList.toggle("show");
  this.classList.toggle("collapsed", !open);
  this.setAttribute("aria-expanded", open ? "true" : "false");
});
document.getElementById("cv-pdf").addEventListener("click", () => {
  const d = new Date();
  document.getElementById("print-date").textContent =
    d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");
  window.print();
});

applySite(); applyTheme(getSetting());
renderCV(); renderResearch(); renderPubs(); renderConf(); renderProjects(); route();
</script>
</body>
